name: ache_obra
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+32
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.6.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  http: ^1.2.0
  mask_text_input_formatter: ^2.5.0
  image_picker: ^1.0.7
  video_player: ^2.8.6
  pdf: ^3.10.4
  share_plus: ^10.1.2
  printing: ^5.13.2
  firebase_core: ^3.10.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.4
  file_picker: ^10.3.10
  record: ^7.1.1
  intl: ^0.19.0
  webview_flutter: ^4.14.1

  # Google Play Billing
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Logo_ache_obra.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/Logo_ache_obra.png
    - assets/termos.pdf